name: CI

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build frontend
        working-directory: 04-1-Docker打包与本地运行/app/frontend
        run: |
          npm ci
          npm run build

      - uses: docker/setup-buildx-action@v3

      - name: Validate compose file
        run: docker compose -f 04-1-Docker打包与本地运行/app/compose.yaml config --quiet

      - name: Build images
        run: docker compose -f 04-1-Docker打包与本地运行/app/compose.yaml build